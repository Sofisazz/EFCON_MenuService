databaseChangeLog:
  - changeSet:
      id: create-table-recipe-steps
      author: Sof
      comment: third liquibase migration
      changes:
        - createTable:
            tableName: recipe_steps
            columns:
              - column:
                  name: recipe_id
                  type: int
              - column:
                  name: description
                  type: TEXT
              - column:
                  name: number_step
                  type: int
        - addForeignKeyConstraint:
            baseTableName: recipe_steps
            baseColumnNames: recipe_id
            referencedTableName: recipes
            referencedColumnNames: recipe_id
            constraintName: recipe_steps_recipes_fk