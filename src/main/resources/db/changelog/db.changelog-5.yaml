databaseChangeLog:
  - changeSet:
      id: create-table-plan-items
      author: Sof
      comment: fifth liquibase migration
      changes:
        - createTable:
            tableName: plan_items
            columns:
              - column:
                  name: item_id
                  type: int
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: recipe_id
                  type: int
              - column:
                  name: plan_id
                  type: int
              - column:
                  name: product_id
                  type: int
              - column:
                  name: unit
                  type: varchar(255)
              - column:
                  name: portions
                  type: int
                  defaultValueNumeric: 1
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: eating_plan
            baseColumnNames: plan_id
            referencedTableName: plan_items
            referencedColumnNames: plan_id
            constraintName: eating_plan_items_fk
        - addForeignKeyConstraint:
            baseTableName: recipes
            baseColumnNames: recipe_id
            referencedTableName: plan_items
            referencedColumnNames: plan_id
            constraintName: recipes_plan_items_fk