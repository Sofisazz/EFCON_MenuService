databaseChangeLog:
  - changeSet:
      id: create-table-recipes
      author: Sof
      comment: first liquibase migration
      changes:
        - createTable:
            tableName: recipes
            columns:
              - column:
                  name: recipe_id
                  type: int
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: varchar(200)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: caloriesFor100
                  type: decimal(10, 2)
              - column:
                  name: proteins
                  type: decimal(10, 2)
              - column:
                  name: fats
                  type: varchar(100)
              - column:
                  name: carbohydrates
                  type: decimal(10, 2)